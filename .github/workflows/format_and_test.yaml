name: format_and_test

on:
  push:
    branches: ['main']
    paths:
      - 'Script/*'
      - 'Core/**'
      - 'Dashboard/**'
      - 'Test/**'
      - '**/*.yaml'
      - '**/*.yml'
      - '.prettierrc*'
  pull_request:
    paths:
      - 'Script/*'
      - 'Core/**'
      - 'Test/**'
      - '**/*.yaml'
      - '**/*.yml'
      - '.prettierrc*'
  workflow_dispatch:

concurrency:
  group: format-and-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6
      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: install tools
        run: npm install -g prettier
      - name: check dashboard script syntax
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('Dashboard/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('Dashboard/index.html contains no inline script');
          for (const [index, match] of scripts.entries()) {
            new Function(match[1]);
            console.log(`Dashboard script ${index + 1}: syntax OK`);
          }
          NODE
      - name: check formatting
        run: |
          prettier --write Test/server.test.js
          git diff -- Test/server.test.js
          git diff --exit-code -- Test/server.test.js
  test:
    needs: format
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0
      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: install dependencies
        run: npm --prefix Test install
      - name: run dashboard integration tests
        run: node Test/dashboard.test.js
