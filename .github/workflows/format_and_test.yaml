name: format_and_test

on:
  push:
    branches: ['main']
    paths:
      - 'Script/**'
      - 'Core/**'
      - 'Dashboard/**'
      - 'Test/**'
      - '**/*.yaml'
      - '**/*.yml'
      - '.prettierrc*'
  pull_request:
    paths:
      - 'Script/**'
      - 'Core/**'
      - 'Dashboard/**'
      - 'Test/**'
      - '**/*.yaml'
      - '**/*.yml'
      - '.prettierrc*'
  workflow_dispatch:

concurrency:
  group: format-and-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: install tools
        # 固定版本：prettier 新版本调整格式规则时不应让无关 PR 突然失败
        run: npm install -g prettier@3.9.9

      - name: check dashboard script syntax
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('Dashboard/index.html', 'utf8');
          const scripts = [...html.matchAll(/<script>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('Dashboard/index.html contains no inline script');
          for (const [index, match] of scripts.entries()) {
            new Function(match[1]);
            console.log(`Dashboard script ${index + 1}: syntax OK`);
          }
          NODE

      - name: check formatting
        run: |
          git ls-files -z '*.js' '*.yml' '*.yaml' | xargs -0 -r prettier --check

  test:
    needs: format
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          fetch-depth: 0

      - name: setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: install dependencies
        run: npm --prefix Test ci || npm --prefix Test install

      - name: run dashboard integration tests
        run: node Test/dashboard.test.js

      - name: run server integration tests
        run: node Test/server.test.js

      - name: run server hardening tests
        run: node Test/server-hardening.test.js

      - name: run universal core tests
        run: node Test/universal-core.test.js

      - name: run custom options regression tests
        run: node Test/custom-options-script.test.js

      - name: check shared script blocks are in sync
        run: node Test/shared-blocks.test.js

      - name: run golden output tests
        run: node Test/golden-output.test.js

      - name: run asset tag tests
        run: node Test/asset-tag.test.js

      - name: run pinned resource tests
        run: node Test/pinned-resources.test.js

      - name: run perf guard tests
        run: node Test/perf-guard.test.js

      - name: run provider filter tests
        run: node Test/provider-filters.test.js

      - name: run provider compatibility tests
        run: node Test/providerCompat.test.js

      - name: run existing regression tests
        run: node Test/run-tests.js

      - name: download mihomo v1.19.32
        run: |
          curl -fL --retry 3 --retry-all-errors \
            -o /tmp/mihomo-v1.19.32.gz \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.32/mihomo-linux-amd64-v1.19.32.gz
          echo "8451100836c9eda194331c2babfad490b2faf30cebc1a04b0e76fd8ac2d35d10  /tmp/mihomo-v1.19.32.gz" > /tmp/mihomo.sha256
          if ! sha256sum -c /tmp/mihomo.sha256; then
            echo "Pinned SHA256 verification failed; refresh the official release checksum before changing this test."
            exit 1
          fi
          gunzip -c /tmp/mihomo-v1.19.32.gz > /tmp/mihomo
          chmod +x /tmp/mihomo

      - name: run mihomo v1.19.32 runtime config validation
        env:
          MIHOMO_BIN: /tmp/mihomo
        run: node Test/mihomo-runtime.test.js

      - name: run mihomo provider behavior test
        env:
          MIHOMO_BIN: /tmp/mihomo
        run: node Test/mihomo-provider-behavior.test.js
